<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页归档助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>网页归档助手</h1>
      <span class="version">v1.0.0</span>
    </header>

    <div class="page-info" id="pageInfo">
      <div class="page-title" id="pageTitle">加载中...</div>
      <div class="page-url" id="pageUrl"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnCapturePage">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        归档整个页面
      </button>

      <button class="btn btn-secondary" id="btnCaptureSelection" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        归档选中内容
      </button>

      <button class="btn btn-secondary" id="btnSelectElement">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/>
        </svg>
        选择区域归档
      </button>
    </div>

    <div class="status" id="status"></div>

    <footer class="footer">
      <a href="#" id="linkOptions">设置</a>
      <span class="divider">|</span>
      <span id="connectionStatus" class="status-disconnected">未连接</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
